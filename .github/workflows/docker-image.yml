name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  resolve-nexttrace-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve latest NTrace-core release
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nxtrace/NTrace-core/releases/latest | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  python-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile Python modules
        run: python -m py_compile app.py nexttrace_mtr.py

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check browser scripts
        run: |
          node --check assets/js/i18n.js
          node --check assets/js/main.js
          node --check assets/js/mtr-agg.js
          node --check assets/js/paths.js
          node --check assets/js/settingsmenu.js
          node --check assets/js/ui-state.js
          for script in assets/js/trace-client.js assets/js/target-resolver.js assets/js/settings-store.js assets/js/view.js; do node --check "$script"; done

      - name: Run frontend tests
        run: |
          node --test tests/*.test.cjs

  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Verify baseline hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          required_snippets = {
              "app.py": [

                  "NTWA_TRUSTED_HOSTS",
                  "SESSION_COOKIE_HTTPONLY",

              ],
              "ntwa/config.py": ["NTWA_SECRET_KEY"],
              "ntwa/http.py": ["/healthz"],
              "Dockerfile": [
                  "FROM python:3.14-slim",
                  "HEALTHCHECK",
              ],
              "requirements.txt": [
                  "gevent==",
                  "gunicorn",
              ],
              "nginx.conf": [
                  "Content-Security-Policy",
                  "X-Content-Type-Options",
                  "Referrer-Policy",
                  "X-Frame-Options",
                  "server_tokens off",
              ],
              ".github/workflows/docker-image.yml": [
                  "pull_request:",
                  "schedule:",
                  "python-wheel-check",
                  "docker-buildx-check",
                  "docker-smoke",
              ],
          }

          missing = []
          for path, snippets in required_snippets.items():
              content = Path(path).read_text()
              for snippet in snippets:
                  if snippet not in content:
                      missing.append(f"{path} missing {snippet!r}")

          if missing:
              raise SystemExit("\n".join(missing))
          PY

  python-wheel-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Verify cp314 linux wheels
        run: |
          set -euo pipefail
          common_args=(
            --only-binary=:all:
            --python-version 3.14
            --implementation cp
            --abi cp314
            -r requirements.txt
          )

          python -m pip download "${common_args[@]}" \
            --dest /tmp/ntwa-wheels-amd64 \
            --platform manylinux_2_28_x86_64 \
            --platform manylinux_2_27_x86_64 \
            --platform manylinux_2_24_x86_64 \
            --platform manylinux2014_x86_64

          python -m pip download "${common_args[@]}" \
            --dest /tmp/ntwa-wheels-arm64 \
            --platform manylinux_2_28_aarch64 \
            --platform manylinux_2_27_aarch64 \
            --platform manylinux_2_24_aarch64 \
            --platform manylinux2014_aarch64

  docker-smoke:
    runs-on: ubuntu-latest
    needs:
      - resolve-nexttrace-release
      - python-check
      - frontend-check
      - security-check
      - python-wheel-check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build smoke image
        run: docker build --pull --no-cache --build-arg NEXTTRACE_RELEASE_TAG="${{ needs.resolve-nexttrace-release.outputs.tag }}" -t nexttraceweb:smoke .

      - name: Reject fixable image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          image-ref: nexttraceweb:smoke
          scanners: vuln
          ignore-unfixed: true
          exit-code: "1"

      - name: Start container
        run: |
          python - <<'PY'
          import os, secrets
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'ntwa-smoke.env'
          path.write_text('NTWA_PUBLIC_MODE=true\nNTWA_SECRET_KEY=' + secrets.token_hex(32) + '\nNTWA_TRUSTED_HOSTS=127.0.0.1,localhost\nNTWA_SESSION_COOKIE_SECURE=false\n')
          path.chmod(0o600)
          PY
          cid="$(docker run -d --network none --cap-drop ALL --cap-add NET_RAW \
            --read-only --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            --memory 512m --cpus 1 --pids-limit 128 --ulimit nofile=1024:1024 \
            --env-file "$RUNNER_TEMP/ntwa-smoke.env" nexttraceweb:smoke 30080)"
          echo "CONTAINER_ID=${cid}" >> "$GITHUB_ENV"
          # Keep every probe inside this isolated network namespace.
          pid="$(docker inspect --format '{{.State.Pid}}' "$cid")"
          sudo nsenter -t "$pid" -n ip route add default dev lo

      - name: Wait for healthz
        run: |
          for _ in $(seq 1 60); do
            if docker exec "$CONTAINER_ID" python /app/docker/healthcheck.py; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$CONTAINER_ID"
          exit 1

      - name: Verify public container isolation and task lifecycle
        run: |
          docker exec -i "$CONTAINER_ID" python - < tests/container_acceptance.py
          if docker logs "$CONTAINER_ID" 2>&1 | grep -E 'Control server error|Read-only file system|Permission denied'; then
            exit 1
          fi

      - name: Verify shutdown with an open SSE request
        run: |
          pid="$(docker inspect --format '{{.State.Pid}}' "$CONTAINER_ID")"
          sudo nsenter -t "$pid" -n python3 tests/container_shutdown.py "$CONTAINER_ID"

      - name: Start TLS deployment with authentication and a sub-path
        env:
          EXPECTED_NEXTTRACE_TAG: ${{ needs.resolve-nexttrace-release.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/ntwa-deployment"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=localhost -addext 'subjectAltName=DNS:localhost' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,digitalSignature,keyEncipherment,keyCertSign' \
            -keyout "$RUNNER_TEMP/ntwa-deployment/key.pem" \
            -out "$RUNNER_TEMP/ntwa-deployment/cert.pem"
          python - <<'PY'
          import os, secrets
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'ntwa-deployment'
          (directory / 'password').write_text(secrets.token_urlsafe(32) + '\n')
          (directory / 'deployment.env').write_text('NTWA_SECRET_KEY=' + secrets.token_hex(32) + '\n')
          # These are disposable CI fixtures, readable by the container's UID 10001.
          directory.chmod(0o755)
          for path in directory.iterdir():
              path.chmod(0o644)
          PY
          cid="$(docker run -d --network none --cap-drop ALL --cap-add NET_RAW \
            --read-only --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            --memory 512m --cpus 1 --pids-limit 128 --ulimit nofile=1024:1024 \
            --mount "type=bind,src=$RUNNER_TEMP/ntwa-deployment,dst=/run/ntwa-secrets,readonly" \
            --env-file "$RUNNER_TEMP/ntwa-deployment/deployment.env" \
            -e EXPECTED_NEXTTRACE_TAG="$EXPECTED_NEXTTRACE_TAG" \
            nexttraceweb:smoke --listen 127.0.0.1:30081 --https-listen 127.0.0.1:30443 \
            --server-name localhost --tls-cert /run/ntwa-secrets/cert.pem \
            --tls-key /run/ntwa-secrets/key.pem --redirect-http-to https://localhost:30443 \
            --base-path /tools/nexttrace --auth-user deploy \
            --auth-password-file /run/ntwa-secrets/password --public-mode)"
          echo "DEPLOYMENT_CONTAINER_ID=${cid}" >> "$GITHUB_ENV"
          pid="$(docker inspect --format '{{.State.Pid}}' "$cid")"
          sudo nsenter -t "$pid" -n ip route add default dev lo

      - name: Verify TLS deployment
        run: |
          for _ in $(seq 1 60); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$DEPLOYMENT_CONTAINER_ID")"
            if [ "$state" = healthy ]; then
              break
            fi
            if [ "$state" = unhealthy ]; then
              docker logs "$DEPLOYMENT_CONTAINER_ID"
              exit 1
            fi
            sleep 2
          done
          test "$state" = healthy
          docker exec -i "$DEPLOYMENT_CONTAINER_ID" python - < tests/container_deployment.py
          docker stop -t 10 "$DEPLOYMENT_CONTAINER_ID" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$DEPLOYMENT_CONTAINER_ID")" = 143

      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs "$CONTAINER_ID"
          if [ -n "${DEPLOYMENT_CONTAINER_ID:-}" ]; then
            docker logs "$DEPLOYMENT_CONTAINER_ID"
          fi

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true
          if [ -n "${DEPLOYMENT_CONTAINER_ID:-}" ]; then
            docker rm -f "$DEPLOYMENT_CONTAINER_ID" >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/ntwa-smoke.env"
          rm -rf "$RUNNER_TEMP/ntwa-deployment"

  docker-buildx-check:
    runs-on: ubuntu-latest
    needs:
      - resolve-nexttrace-release
      - python-check
      - frontend-check
      - security-check
      - python-wheel-check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          pull: true
          no-cache: true
          build-args: |
            NEXTTRACE_RELEASE_TAG=${{ needs.resolve-nexttrace-release.outputs.tag }}

  publish:
    runs-on: ubuntu-latest
    needs:
      - resolve-nexttrace-release
      - python-check
      - frontend-check
      - security-check
      - docker-smoke
      - docker-buildx-check
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          tags="tsosc/nexttraceweb:sha-${short_sha}"
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            tags="${tags},tsosc/nexttraceweb:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags},tsosc/nexttraceweb:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXTTRACE_RELEASE_TAG=${{ needs.resolve-nexttrace-release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
