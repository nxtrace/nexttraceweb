worker_processes 1;
pid /tmp/ntwa-nginx.pid;
error_log stderr;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    client_body_temp_path /tmp/ntwa-client-body;
    proxy_temp_path /tmp/ntwa-proxy;
    fastcgi_temp_path /tmp/ntwa-fastcgi;
    uwsgi_temp_path /tmp/ntwa-uwsgi;
    scgi_temp_path /tmp/ntwa-scgi;
    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    # Only explicitly trusted outer proxies may supply client/protocol headers.
    __TRUSTED_PROXY_DIRECTIVES__
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    geo $realip_remote_addr $ntwa_trusted_proxy {
        default 0;
        __TRUSTED_PROXY_RANGES__
    }
    map "$ntwa_trusted_proxy:$http_x_forwarded_proto" $ntwa_scheme {
        default $scheme;
        "1:https" https;
    }
    limit_req_zone $binary_remote_addr zone=api_ip:1m rate=10r/s;
    limit_req_zone $server_name zone=api_global:1m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=sse_open:1m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=sse_ip:1m;
    limit_conn_zone $server_name zone=sse_global:1m;
    log_format bounded '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    upstream app {
        server 127.0.0.1:35000;
        keepalive 16;
    }

    server {
        __LISTEN_DIRECTIVES__
        server_name _;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://cloudflare-dns.com https://doh.sb; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        proxy_http_version 1.1;
        proxy_read_timeout 25s;
        proxy_send_timeout 10s;
        proxy_connect_timeout 5s;
        send_timeout 15s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $ntwa_scheme;

        location ~ ^/api/traces/[^/]+/events$ {
            __PUBLIC_SSE_LIMITS__
            proxy_buffering off;
            proxy_pass http://app;
        }

        location /api/ {
            __PUBLIC_API_LIMITS__
            proxy_pass http://app;
        }

        location / {
            proxy_pass http://app;
        }

        location = /favicon.ico {
            proxy_pass http://app/assets/favicon.ico;
        }

        access_log /dev/stdout bounded;
        error_log stderr;
    }
}
